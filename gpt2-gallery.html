<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark-gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GPT Image 2 提示词库 · GaryAIGC</title>
<style>
:root {
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --radius:14px; --radius-sm:10px;
  --transition:0.25s cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark-gold"]{
  --bg:#0a0a0f;--bg-card:#12121a;--bg-card-hover:#1a1a26;
  --border:rgba(200,164,92,0.12);--border-hover:rgba(200,164,92,0.25);
  --text:#e8e8ee;--text-dim:#8888a0;--text-muted:#5a5a72;
  --accent:#c8a45c;--accent-glow:rgba(200,164,92,0.12);
  --gradient:linear-gradient(135deg,#c8a45c,#e8c97a);
  --badge-bg:rgba(200,164,92,0.1);--badge-text:#c8a45c;
  --nav-bg:rgba(10,10,15,0.92);--nav-border:rgba(255,255,255,0.06);
  --header-gradient:radial-gradient(ellipse at 50% 0%,rgba(200,164,92,0.1) 0%,transparent 60%);
}
[data-theme="dark-blue"]{
  --bg:#060b14;--bg-card:#0e1528;--bg-card-hover:#162040;
  --border:rgba(56,139,253,0.12);--border-hover:rgba(56,139,253,0.25);
  --text:#dde4f0;--text-dim:#7a8ba8;--text-muted:#4a5a78;
  --accent:#388bfd;--accent-glow:rgba(56,139,253,0.12);
  --gradient:linear-gradient(135deg,#388bfd,#79c0ff);
  --badge-bg:rgba(56,139,253,0.1);--badge-text:#58a6ff;
  --nav-bg:rgba(6,11,20,0.92);--nav-border:rgba(255,255,255,0.06);
  --header-gradient:radial-gradient(ellipse at 50% 0%,rgba(56,139,253,0.08) 0%,transparent 60%);
}
[data-theme="dark-purple"]{
  --bg:#0f0a18;--bg-card:#181228;--bg-card-hover:#241a38;
  --border:rgba(168,130,255,0.12);--border-hover:rgba(168,130,255,0.25);
  --text:#e8ddf8;--text-dim:#9888b8;--text-muted:#5a4a78;
  --accent:#a882ff;--accent-glow:rgba(168,130,255,0.12);
  --gradient:linear-gradient(135deg,#a882ff,#d4b8ff);
  --badge-bg:rgba(168,130,255,0.1);--badge-text:#b892ff;
  --nav-bg:rgba(15,10,24,0.92);--nav-border:rgba(255,255,255,0.06);
  --header-gradient:radial-gradient(ellipse at 50% 0%,rgba(168,130,255,0.08) 0%,transparent 60%);
}
[data-theme="light-warm"]{
  --bg:#faf7f2;--bg-card:#ffffff;--bg-card-hover:#f5f0e8;
  --border:rgba(180,140,80,0.15);--border-hover:rgba(180,140,80,0.3);
  --text:#2d2a24;--text-dim:#7a7060;--text-muted:#a09080;
  --accent:#b48c50;--accent-glow:rgba(180,140,80,0.1);
  --gradient:linear-gradient(135deg,#b48c50,#d4a860);
  --badge-bg:rgba(180,140,80,0.08);--badge-text:#8a6030;
  --nav-bg:rgba(250,247,242,0.92);--nav-border:rgba(0,0,0,0.08);
  --header-gradient:radial-gradient(ellipse at 50% 0%,rgba(180,140,80,0.05) 0%,transparent 60%);
}
[data-theme="light-cool"]{
  --bg:#f5f7fa;--bg-card:#ffffff;--bg-card-hover:#eef1f6;
  --border:rgba(60,120,200,0.12);--border-hover:rgba(60,120,200,0.25);
  --text:#1a2436;--text-dim:#5a6a80;--text-muted:#8a9ab0;
  --accent:#3c78c8;--accent-glow:rgba(60,120,200,0.08);
  --gradient:linear-gradient(135deg,#3c78c8,#5a98e8);
  --badge-bg:rgba(60,120,200,0.06);--badge-text:#2a5a9a;
  --nav-bg:rgba(245,247,250,0.92);--nav-border:rgba(0,0,0,0.08);
  --header-gradient:radial-gradient(ellipse at 50% 0%,rgba(60,120,200,0.04) 0%,transparent 60%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:3px}

/* ===== 统一胶囊导航 ===== */
.unav-wrap{position:sticky;top:14px;z-index:200;display:flex;justify-content:center;padding:14px 16px 0}
.unav{display:flex;align-items:center;gap:3px;background:var(--nav-bg);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--nav-border);border-radius:999px;padding:7px 12px;
  box-shadow:0 10px 34px rgba(0,0,0,0.28);max-width:100%;flex-wrap:wrap;justify-content:center}
.unav-logo{font-size:17px;font-weight:800;letter-spacing:-0.3px;background:var(--gradient);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  padding:6px 12px;cursor:pointer;white-space:nowrap}
.unav-sep{width:1px;height:18px;background:var(--nav-border);margin:0 5px}
.unav-item{position:relative}
.unav-btn{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;
  font-size:13.5px;font-weight:500;color:var(--text-dim);cursor:pointer;border:none;
  background:transparent;transition:all var(--transition);white-space:nowrap;font-family:var(--font);text-decoration:none}
.unav-btn:hover,.unav-item.open .unav-btn,.unav-btn.active{color:var(--text);background:var(--accent-glow)}
.unav-btn .caret{font-size:9px;opacity:0.6;transition:transform var(--transition)}
.unav-item:hover .caret,.unav-item.open .caret{transform:rotate(180deg)}
.unav-drop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);
  min-width:160px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:8px;opacity:0;visibility:hidden;transition:all 0.22s;z-index:300;
  box-shadow:0 16px 44px rgba(0,0,0,0.4)}
.unav-drop.right{left:auto;right:0;transform:translateY(6px)}
.unav-item:hover .unav-drop,.unav-item.open .unav-drop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.unav-item:hover .unav-drop.right,.unav-item.open .unav-drop.right{transform:translateY(0)}
.unav-link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border-radius:9px;font-size:13px;color:var(--text-dim);cursor:pointer;transition:all var(--transition)}
.unav-link:hover{background:var(--accent-glow);color:var(--text)}
@media (max-width:640px){.unav{gap:2px;padding:6px 8px}.unav-btn{padding:6px 9px;font-size:12.5px}}

/* Layout */
.container{max-width:1280px;margin:0 auto;padding:0 20px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin:18px 0 0;padding:8px 16px;
  border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;
  color:var(--text-dim);background:var(--bg-card);transition:all var(--transition)}
.back-link:hover{color:var(--accent);border-color:var(--border-hover)}
.page-header{padding:52px 0 26px;text-align:center;background:var(--header-gradient)}
.page-header h1{font-size:clamp(28px,4.6vw,44px);font-weight:900;letter-spacing:-1px;margin-bottom:10px}
.page-header h1 span{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-header p{font-size:15px;color:var(--text-dim);max-width:600px;margin:0 auto}

/* 工具行：分类筛选 + 搜索 */
.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);transition:all var(--transition)}
.chip:hover{border-color:var(--border-hover);color:var(--text)}
.chip.on{background:var(--accent-glow);border-color:var(--border-hover);color:var(--accent);font-weight:700}
.search-row{display:flex;justify-content:center}
.search-box{width:min(520px,100%);display:flex;align-items:center;gap:8px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:999px;padding:10px 18px}
.search-box svg{width:16px;height:16px;color:var(--text-muted);flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;background:transparent;color:var(--text);
  font-size:14px;font-family:var(--font)}
.search-box input::placeholder{color:var(--text-muted)}

/* 提示词卡 */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:20px}
.p-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:all var(--transition);display:flex;flex-direction:column}
.p-card:hover{border-color:var(--border-hover);transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,0.3)}
.p-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg-card-hover);display:block}
.p-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.p-title{font-size:14.5px;font-weight:800}
.p-cats{display:flex;flex-wrap:wrap;gap:5px}
.p-cat{font-size:11px;color:var(--badge-text);background:var(--badge-bg);border:1px solid var(--border);
  padding:2px 9px;border-radius:11px}
.p-prompt{font-size:12.5px;color:var(--text-dim);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  border-top:1px dashed var(--border);padding-top:8px}
.p-card.exp .p-prompt{-webkit-line-clamp:unset}
.p-more{font-size:11.5px;color:var(--accent);cursor:pointer;align-self:flex-start}
.p-actions{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.p-copy{flex:1;padding:8px 0;border-radius:18px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;
  border:1px solid var(--border);background:transparent;color:var(--accent);transition:all var(--transition);font-family:var(--font)}
.p-copy:hover{border-color:var(--border-hover);background:var(--accent-glow)}

.load-wrap{text-align:center;margin:6px 0 56px}
.load-btn{padding:11px 34px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);transition:all var(--transition);font-family:var(--font)}
.load-btn:hover{border-color:var(--border-hover);color:var(--text)}
.empty-tip{text-align:center;color:var(--text-muted);padding:60px 0;font-size:14px}

.footer{text-align:center;padding:36px 20px;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border)}

/* ===== 右缘打赏竖条 + 弹窗 ===== */
.donate-strip{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:90;
  writing-mode:vertical-rl;padding:16px 8px;font-size:13px;letter-spacing:3px;cursor:pointer;
  color:var(--accent);background:var(--bg-card);border:1px solid var(--border);border-right:none;
  border-radius:12px 0 0 12px;transition:all .25s;font-family:var(--font)}
.donate-strip:hover{border-color:var(--border-hover);padding-right:12px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:500;
  display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .25s}
.modal-mask.show{opacity:1;visibility:visible}
.modal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px;
  text-align:center;max-width:90vw;transform:translateY(10px);transition:transform .25s}
.modal-mask.show .modal-card{transform:translateY(0)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-desc{font-size:13.5px;color:var(--text-dim);margin-bottom:16px}
.modal-qr img{width:190px;aspect-ratio:3/4;height:auto;object-fit:contain;background:#fff;padding:8px;border-radius:12px}
.modal-close{margin-top:16px;padding:8px 22px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:var(--font)}
.modal-close:hover{border-color:var(--border-hover);color:var(--text)}
@media (max-width:640px){.donate-strip{display:none}.modal-qr img{width:130px}}
</style>
</head>
<body>

<!-- ===== 统一胶囊导航 ===== -->
<div class="unav-wrap">
  <nav class="unav">
    <span class="unav-logo" onclick="location.href='index.html'">GaryAIGC</span>
    <span class="unav-sep"></span>
    <div class="unav-item"><a class="unav-btn" href="index.html#tools">AI创作</a></div>
    <div class="unav-item"><a class="unav-btn" href="benefits.html">AI福利</a></div>
    <div class="unav-item"><a class="unav-btn active" href="knowledge.html">知识库</a></div>
    <div class="unav-item"><a class="unav-btn" href="resources.html">资源库</a></div>
    <div class="unav-item"><a class="unav-btn" href="videos.html">视频教程</a></div>
    <div class="unav-item"><a class="unav-btn" href="community.html">社区</a></div>
    <span class="unav-sep"></span>
    <div class="unav-item">
      <button class="unav-btn" type="button">主题 <span class="caret">▼</span></button>
      <div class="unav-drop right">
        <a class="unav-link" onclick="setTheme('dark-gold')">暗金 Dark Gold</a>
        <a class="unav-link" onclick="setTheme('dark-blue')">暗蓝 Deep Blue</a>
        <a class="unav-link" onclick="setTheme('dark-purple')">暗紫 Violet</a>
        <a class="unav-link" onclick="setTheme('light-warm')">暖白 Warm</a>
        <a class="unav-link" onclick="setTheme('light-cool')">冷白 Cool</a>
      </div>
    </div>
  </nav>
</div>

<header class="page-header">
  <h1>🖼️ <span>GPT Image 2 提示词库</span></h1>
  <p>1000 条精选提示词 · 效果图 + 完整提示词一键复制 · 按分类筛选</p>
</header>

<main class="container">
  <a class="back-link" href="index.html">← 返回主页</a>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="搜索标题或提示词关键词...">
      </div>
    </div>
  </div>
  <div class="p-grid" id="grid"></div>
  <div class="load-wrap"><button class="load-btn" id="loadMore" type="button">加载更多</button></div>
</main>

<footer class="footer">
  <p>© 2025 GaryAIGC · 提示词仅供学习参考</p>
</footer>

<!-- 打赏作者 -->
<div class="donate-strip" id="donateBtn">打赏作者</div>
<div class="modal-mask" id="donateModal">
  <div class="modal-card">
    <div class="modal-title">请作者喝杯咖啡</div>
    <div class="modal-desc">如果你觉得本站对你有帮助，微信扫码支持一下，任意金额都是鼓励</div>
    <div class="modal-qr"><img src="wx-pay.jpg" alt="微信收款码"></div>
    <button class="modal-close" id="donateClose" type="button">关闭</button>
  </div>
</div>

<script src="data/prompts.v1.js"></script>
<script>
/* ===== 主题切换 ===== */
function setTheme(t){
  if (["dark-gold","dark-blue","dark-purple","light-warm","light-cool"].indexOf(t) < 0) t = "dark-gold";
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('gary-theme',t);
  closeUnavDrops();
}
(function(){
  var saved = localStorage.getItem('gary-theme');
  if (saved && saved.indexOf("light-") !== 0) setTheme(saved);
  else setTheme("dark-gold");
})();
/* ===== 导航下拉（触屏点击支持） ===== */
function closeUnavDrops(){ document.querySelectorAll(".unav-item.open").forEach(function(i){ i.classList.remove("open"); }); }
document.querySelectorAll(".unav-item > button.unav-btn").forEach(function(btn){
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    var item = btn.parentElement, was = item.classList.contains("open");
    closeUnavDrops();
    if (!was) item.classList.add("open");
  });
});
document.addEventListener("click", closeUnavDrops);

/* ===== 提示词图库 ===== */
var DB = (window.PROMPT_DB || []).map(function(it){
  /* 清理源数据中的转义残留：字面 \n → 空格，字面 \uXXXX → 实际字符 */
  it.p = it.p.replace(/\\n/g, " ").replace(/\\u([0-9a-fA-F]{4})/g, function(m, h){
    return String.fromCharCode(parseInt(h, 16));
  }).replace(/\s{2,}/g, " ").trim();
  return it;
});
var PAGE = 48;
var shown = 0, curCat = "", curQ = "";
var grid = document.getElementById("grid"), loadBtn = document.getElementById("loadMore");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function filtered(){
  var q = curQ.trim().toLowerCase();
  return DB.filter(function(it){
    if (curCat && it.c.indexOf(curCat) < 0) return false;
    if (q && it.t.toLowerCase().indexOf(q) < 0 && it.p.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function card(it){
  var cats = it.c.split(",").slice(0,3).map(function(c){return '<span class="p-cat">'+esc(c.trim())+'</span>'}).join("");
  return '<div class="p-card" data-id="'+it.id+'">'
    + '<img class="p-img" loading="lazy" src="'+it.img+'" alt="'+esc(it.t)+'">'
    + '<div class="p-body">'
    + '<div class="p-title">'+esc(it.t)+'</div>'
    + '<div class="p-cats">'+cats+'</div>'
    + '<div class="p-prompt" title="点击展开/收起">'+esc(it.p)+'</div>'
    + '<div class="p-actions"><button class="p-copy" type="button" data-p="'+it.id+'">复制提示词</button></div>'
    + '</div></div>';
}
function render(reset){
  var list = filtered();
  if (reset) { grid.innerHTML = ""; shown = 0; }
  var slice = list.slice(shown, shown + PAGE);
  var html = slice.map(card).join("");
  grid.insertAdjacentHTML("beforeend", html);
  shown += slice.length;
  loadBtn.style.display = shown < list.length ? "" : "none";
  if (reset && !list.length) grid.innerHTML = '<div class="empty-tip">没有匹配的提示词</div>';
  if (!reset || list.length) {
    var tip = grid.querySelector(".empty-tip");
    if (tip) tip.remove();
  }
}
/* 分类 chips：取数据中出现最多的 8 类 */
(function(){
  var cnt = {};
  DB.forEach(function(it){ it.c.split(",").forEach(function(c){ c=c.trim(); cnt[c]=(cnt[c]||0)+1; }); });
  var top = Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,8);
  var box = document.getElementById("chips");
  box.innerHTML = '<span class="chip on" data-c="">全部</span>' + top.map(function(c){
    return '<span class="chip" data-c="'+esc(c)+'">'+esc(c)+'</span>';
  }).join("");
  box.querySelectorAll(".chip").forEach(function(ch){
    ch.addEventListener("click", function(){
      box.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")});
      ch.classList.add("on");
      curCat = ch.getAttribute("data-c");
      render(true);
    });
  });
})();
document.getElementById("q").addEventListener("input", function(){ curQ = this.value; render(true); });
loadBtn.addEventListener("click", function(){ render(false); });
/* 展开/收起提示词 + 复制 */
grid.addEventListener("click", function(e){
  var pr = e.target.closest(".p-prompt");
  if (pr) { pr.closest(".p-card").classList.toggle("exp"); return; }
  var btn = e.target.closest(".p-copy");
  if (btn) {
    var it = DB.find(function(x){return x.id === btn.getAttribute("data-p")});
    if (!it) return;
    function done(){ btn.textContent = "已复制 ✓"; setTimeout(function(){ btn.textContent = "复制提示词"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(it.p).then(done).catch(function(){ fallback(); });
    } else fallback();
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = it.p; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(_){}
      ta.remove(); done();
    }
  }
});
render(true);

/* ===== 打赏弹窗 ===== */
(function(){
  var btn = document.getElementById("donateBtn"), modal = document.getElementById("donateModal"), close = document.getElementById("donateClose");
  if (!btn || !modal) return;
  btn.addEventListener("click", function(){ modal.classList.add("show"); });
  close.addEventListener("click", function(){ modal.classList.remove("show"); });
  modal.addEventListener("click", function(e){ if (e.target === modal) modal.classList.remove("show"); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") modal.classList.remove("show"); });
})();
</script>
</body>
