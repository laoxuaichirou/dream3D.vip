<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT Image 2 提示词库 | GaryAIGC</title>
<style>
:root {
  --bg: #0a0a14;
  --card: #13131f;
  --card-hover: #1a1a2e;
  --border: rgba(255,255,255,0.08);
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #00d4ff;
  --accent2: #c084fc;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }

/* Header */
.header {
  position:sticky; top:0; z-index:100;
  background:rgba(10,10,20,0.92); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:16px 24px;
}
.header-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
.logo { font-size:20px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header-stats { font-size:13px; color:var(--text-dim); }

/* Filters */
.filters { display:flex; gap:8px; flex-wrap:wrap; padding:16px 24px; max-width:1400px; margin:0 auto; }
.filter-btn {
  padding:6px 16px; border-radius:20px; border:1px solid var(--border);
  background:transparent; color:var(--text-dim); cursor:pointer;
  font-size:13px; transition:all .2s;
}
.filter-btn:hover { border-color:var(--accent); color:#fff; }
.filter-btn.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
.filter-count { font-size:11px; opacity:0.6; margin-left:4px; }

/* Grid */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; padding:8px 24px 40px; max-width:1400px; margin:0 auto; }
.card {
  background:var(--card); border-radius:var(--radius);
  border:1px solid var(--border); overflow:hidden;
  cursor:pointer; transition:all .25s;
}
.card:hover { background:var(--card-hover); transform:translateY(-2px); border-color:rgba(255,255,255,0.15); }
.card-img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#1a1a2e; }
.card-body { padding:12px; }
.card-title { font-size:14px; font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-meta { display:flex; gap:12px; margin-top:6px; font-size:11px; color:var(--text-dim); }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,0.8); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.modal-overlay.open { opacity:1; pointer-events:auto; }
.modal {
  background:var(--card); border-radius:16px;
  border:1px solid var(--border);
  max-width:720px; width:90vw; max-height:85vh; overflow-y:auto;
  padding:0;
}
.modal-img { width:100%; max-height:400px; object-fit:contain; background:#0a0a14; }
.modal-body { padding:24px; }
.modal-title { font-size:20px; font-weight:700; margin-bottom:12px; }
.modal-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.modal-tag { padding:3px 10px; border-radius:12px; background:rgba(0,212,255,0.1); color:var(--accent); font-size:12px; }
.modal-prompt { background:#0a0a14; border-radius:8px; padding:16px; margin-bottom:16px; font-size:13px; line-height:1.7; color:#ccc; white-space:pre-wrap; max-height:200px; overflow-y:auto; }
.modal-stats { display:flex; gap:16px; font-size:12px; color:var(--text-dim); margin-bottom:20px; }
.modal-actions { display:flex; gap:12px; }
.btn {
  padding:10px 24px; border-radius:8px; border:none; cursor:pointer;
  font-size:14px; font-weight:600; transition:all .2s;
}
.btn-use { background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#000; flex:1; }
.btn-use:hover { opacity:0.9; transform:scale(1.02); }
.btn-copy { background:var(--card-hover); color:#fff; border:1px solid var(--border); }
.btn-copy:hover { background:#222; }
.btn-close { position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.1); border:none; color:#fff; cursor:pointer; font-size:16px; }

/* Loading */
.loading { text-align:center; padding:60px; color:var(--text-dim); }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Empty / Error */
.empty { text-align:center; padding:60px; color:var(--text-dim); font-size:15px; }

@media (max-width:600px) {
  .grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; padding:8px 12px 24px; }
  .card-body { padding:8px; }
  .card-title { font-size:12px; }
  .modal { width:95vw; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <span class="logo">GPT Image 2 · 提示词库</span>
    <span class="header-stats" id="headerStats">加载中...</span>
  </div>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="all">全部</button>
</div>

<div class="grid" id="grid"></div>

<script>
// Category extraction from items
const CATS = {};

// Load all data
let allItems = [];
let displayItems = [];
let loadedPages = 0;
const TOTAL_PAGES = 100;

async function loadPage(n) {
  const pad = String(n).padStart(4, '0');
  const resp = await fetch(`gpt2_data/page_${pad}.json`);
  if (!resp.ok) return null;
  const items = await resp.json();
  // Categorize
  for (const item of items) {
    const cats = (item.categories || '').split(',');
    for (const c of cats) {
      const ct = c.trim();
      if (ct) CATS[ct] = (CATS[ct] || 0) + 1;
    }
  }
  return items;
}

async function loadAll() {
  for (let i = 0; i < TOTAL_PAGES; i++) {
    const items = await loadPage(i);
    if (!items) break;
    allItems.push(...items);
    loadedPages++;
    // Update header
    document.getElementById('headerStats').textContent = `已加载 ${allItems.length} 条提示词`;
  }
  buildFilters();
  filter('all');
}

function buildFilters() {
  const container = document.getElementById('filters');
  const sorted = Object.entries(CATS).sort((a,b) => b[1] - a[1]).slice(0, 20);
  for (const [cat, count] of sorted) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.innerHTML = `${cat}<span class="filter-count">${count}</span>`;
    btn.onclick = () => filter(cat);
    container.appendChild(btn);
  }
}

function filter(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (cat === 'all') {
    document.querySelector('[data-cat="all"]').classList.add('active');
    displayItems = allItems;
  } else {
    document.querySelector(`[data-cat="${cat}"]`)?.classList.add('active');
    displayItems = allItems.filter(item => (item.categories || '').includes(cat));
  }
  document.getElementById('headerStats').textContent = 
    `显示 ${displayItems.length} / ${allItems.length} 条 · 已加载 ${loadedPages} 页`;
  render();
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = displayItems.slice(0, 200).map((item, i) => {
    const img = item.images?.[0] || '';
    const prompt = item.prompt_en || item.prompt_cn || '';
    return `
    <div class="card" onclick="openDetail(${allItems.indexOf(item)})">
      ${img ? `<img class="card-img" src="${img}" loading="lazy" onerror="this.style.display='none'">` : '<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#444;font-size:24px">🖼️</div>'}
      <div class="card-body">
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-meta">
          ${item.author ? `<span>${esc(item.author)}</span>` : ''}
          ${item.categories ? `<span>${item.categories.split(',')[0]}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function openDetail(idx) {
  const item = displayItems[idx];
  if (!item) return;
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <button class="btn-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      ${item.images?.[0] ? `<img class="modal-img" src="${item.images[0]}" onerror="this.style.display='none'">` : ''}
      <div class="modal-body">
        <div class="modal-title">${esc(item.title)}</div>
        ${item.categories ? `
        <div class="modal-tags">
          ${item.categories.split(',').map(c => `<span class="modal-tag">${c.trim()}</span>`).join('')}
        </div>` : ''}
        ${(item.prompt_en || item.prompt_cn) ? `
        <div class="modal-prompt">${esc(item.prompt_en || item.prompt_cn)}</div>` : ''}
        <div class="modal-stats">
          ${item.author ? `<span>👤 ${esc(item.author)}</span>` : ''}
        </div>
        <div class="modal-actions">
          <button class="btn btn-use" onclick="usePrompt('${escAttr(item.prompt_en || item.prompt_cn)}')">🎨 使用此提示词</button>
          <button class="btn btn-copy" onclick="copyPrompt('${escAttr(item.prompt_en || item.prompt_cn)}')">📋 复制</button>
        </div>
      </div>
    </div>
  `;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
}

function usePrompt(text) {
  // TODO: replace with actual generation page URL when vibeX project is exported
  alert('正在跳转到生图页面...\n\n提示词已复制到剪贴板');
  navigator.clipboard.writeText(text);
}

function copyPrompt(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ 提示词已复制到剪贴板');
  });
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'\\n'); }

// Start loading
loadAll();
</script>
</body>
</html>
